name: Знімок цін прикладу

# Раз на добу звіряє приклад зі сторінки з API Нової Пошти і, якщо ціни змінилися
# (або знімку понад 7 днів), комітить js/snapshot.js. Пуш у main оновлює сайт.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Звірити з API НП
        run: node tools/update-snapshot.mjs
      - name: Закомітити, якщо знімок змінився
        run: |
          if git diff --quiet -- js/snapshot.js; then
            echo "Знімок не змінився"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/snapshot.js
          git commit -m "Знімок цін прикладу: звірено з API НП"
          git push
